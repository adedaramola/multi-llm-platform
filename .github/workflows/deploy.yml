name: Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - "ai-platform/**"
      - "terraform/**"
      - ".github/workflows/**"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "ai-platform/**"
      - "terraform/**"
      - ".github/workflows/**"
      - "!**/*.md"

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  # GitHub-hosted runners support Node.js 24. Force any JavaScript action that
  # has not yet changed its metadata default to run on the supported runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}
  ENABLE_PROVISIONED_CONCURRENCY: ${{ vars.ENABLE_PROVISIONED_CONCURRENCY || 'false' }}

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-platform/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-platform/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          cd ai-platform
          ruff check ai_platform tests

      - name: Type check (mypy)
        run: |
          cd ai-platform
          mypy

      - name: Run tests (coverage gate in pyproject.toml)
        run: |
          cd ai-platform
          python -m pytest tests/ -v --tb=short

      - uses: hashicorp/setup-terraform@v4

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  # ── Deploy (main branch only) ───────────────────────────────────────────────
  deploy:
    name: Deploy Lambda Gateway
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}-lambda-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up QEMU (required to run arm64 containers on x86 runners)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Lambda zip (linux/arm64)
        run: |
          cd ai-platform
          mkdir -p dist/package
          docker run --rm --platform linux/arm64 \
            -v "$(pwd)":/src \
            --entrypoint /bin/bash \
            public.ecr.aws/lambda/python:3.12-arm64 \
            -c "pip install -r /src/requirements.txt -t /src/dist/package --quiet \
                && cp -r /src/ai_platform /src/dist/package/"
          cd dist/package && zip -r ../ai-platform.zip . -q
          echo "Zip size: $(du -sh dist/ai-platform.zip | cut -f1)"

      - name: Deploy gateway Lambda
        run: |
          FUNCTION_NAME="ai-platform-gateway-${DEPLOY_ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://ai-platform/dist/ai-platform.zip \
            --architectures arm64 \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          # Publish a new version and move the "live" alias to it.
          # Provisioned concurrency is attached to the alias, so this keeps
          # the 2 warm instances on the latest code without any downtime.
          VERSION=$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query Version --output text)
          aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name live \
            --function-version "$VERSION" \
            --region "$AWS_REGION"

          if [ "$ENABLE_PROVISIONED_CONCURRENCY" = "true" ]; then
            # AWS can temporarily route to the old version while warming.
            for attempt in $(seq 1 60); do
              STATUS=$(aws lambda get-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier live --region "$AWS_REGION" \
                --query Status --output text)
              if [ "$STATUS" = "FAILED" ]; then
                aws lambda get-provisioned-concurrency-config \
                  --function-name "$FUNCTION_NAME" \
                  --qualifier live --region "$AWS_REGION" \
                  --query '{status:Status,reason:StatusReason}' --output json
                exit 1
              fi
              ALIAS_VERSION=$(aws lambda get-alias \
                --function-name "$FUNCTION_NAME" \
                --name live --region "$AWS_REGION" \
                --query FunctionVersion --output text)
              ROUTING=$(aws lambda get-alias \
                --function-name "$FUNCTION_NAME" \
                --name live --region "$AWS_REGION" \
                --query RoutingConfig.AdditionalVersionWeights --output json)
              if [ "$STATUS" = "READY" ] \
                && [ "$ALIAS_VERSION" = "$VERSION" ] \
                && { [ "$ROUTING" = "null" ] || [ "$ROUTING" = "{}" ]; }; then
                echo "Gateway version $VERSION is fully live"
                break
              fi
              if [ "$attempt" = "60" ]; then
                echo "Timed out waiting for gateway version $VERSION"
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Deploy health-checker Lambda
        if: vars.ENABLE_SCHEDULED_HEALTH_CHECKS == 'true'
        run: |
          FUNCTION_NAME="ai-platform-health-checker-${DEPLOY_ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://ai-platform/dist/ai-platform.zip \
            --architectures arm64 \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Smoke test scheduled provider checks
        if: vars.ENABLE_SCHEDULED_HEALTH_CHECKS == 'true'
        run: |
          FUNCTION_NAME="ai-platform-health-checker-${DEPLOY_ENVIRONMENT}"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' health-checker-result.json
          jq -e '.statusCode == 200 and (.results | length) >= 1 and ([.results[].healthy] | all)' \
            health-checker-result.json

      - name: Smoke test gateway
        run: |
          API_URL=$(aws apigatewayv2 get-apis --region "$AWS_REGION" \
            --query "Items[?Name=='ai-platform-${DEPLOY_ENVIRONMENT}'].ApiEndpoint | [0]" \
            --output text)
          [ -n "$API_URL" ] && [ "$API_URL" != "None" ]
          STATUS=$(curl -sS --connect-timeout 10 --max-time 45 \
            -o health.json -w "%{http_code}" "$API_URL/health")
          echo "Health check status: $STATUS"
          [ "$STATUS" = "200" ]
          jq -e '.status == "ok"' health.json
